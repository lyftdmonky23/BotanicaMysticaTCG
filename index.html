<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botanica Mystica | WAX TCG</title>
    <style>
        :root {
            --bg-color: #0c120e;
            --card-bg: #151e19;
            --accent-green: #2ecc71;
            --accent-gold: #f1c40f;
            --accent-mythic: #e74c3c;
            --text-main: #e0e6e3;
            --text-sub: #a0b2a6;
            --border-color: #27382f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 3rem 1rem;
            background: linear-gradient(180deg, #121c16 0%, var(--bg-color) 100%);
            border-bottom: 2px solid var(--accent-green);
        }

        .cover-poster {
            width: 100%;
            max-width: 360px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            border: 2px solid var(--accent-gold);
            margin-bottom: 1.5rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            color: var(--accent-gold);
            font-size: 2.8rem;
            margin: 0.5rem 0;
            letter-spacing: 2px;
        }

        p.tagline {
            color: var(--text-sub);
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto 1.5rem auto;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .cta-btn {
            display: inline-block;
            background-color: var(--accent-green);
            color: #000;
            padding: 0.8rem 2rem;
            font-weight: bold;
            border-radius: 25px;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
        }

        .cta-btn:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        }

            background-color: var(--accent-gold);
            color: #000;
        }
