<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botanica Mystica TCG | Card Evolution Hierarchy</title>
    <style>
        :root {
            --bg-dark: #0a110d;
            --card-bg: #132219;
            --accent-green: #2e7d32;
            --accent-emerald: #00e676;
            --accent-gold: #ffd700;
            --text-light: #e8f5e9;
            --text-muted: #a3b899;
            --border-color: #1b4332;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        /* Header Navigation */
        header {
            background-color: rgba(10, 17, 13, 0.95);
            border-bottom: 2px solid var(--border-color);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .action-btn {
            background: linear-gradient(135deg, #1b4332, #2e7d32);
            color: var(--text-light);
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: bold;
            border: 1px solid var(--accent-emerald);
            transition: all 0.3s ease;
            display: inline-block;
            text-align: center;
        }

        .action-btn:hover {
            background: var(--accent-emerald);
            color: #000;
            box-shadow: 0 0 12px var(--accent-emerald);
            transform: translateY(-2px);
        }

        /* Hero Banner */
        .hero {
            text-align: center;
            padding: 3.5rem 1rem;
            background: radial-gradient(circle at center, #1b4332 0%, var(--bg-dark) 75%);
            border-bottom: 1px solid var(--border-color);
        }

        .hero h1 {
            font-size: 2.8rem;
            color: var(--accent-gold);
            margin-bottom: 0.8rem;
        }

        .hero p {
            max-width: 650px;
            margin: 0 auto;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 2.5rem auto;
            padding: 0 1rem;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--accent-emerald);
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.8rem;
        }

        /* Vertical Hierarchy Flow */
        .hierarchy-list {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            align-items: center;
