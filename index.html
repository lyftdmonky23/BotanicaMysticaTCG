<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botanica Mystica | WAX TCG</title>
    <style>
        :root {
            --bg-color: #0f1412;
            --card-bg: #1a231f;
            --accent-green: #2ecc71;
            --accent-gold: #f1c40f;
            --text-main: #e0e6e3;
            --text-sub: #a0b2a6;
            --border-color: #2d3e36;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 2rem 1rem 3rem 1rem;
            background: linear-gradient(180deg, #141e18 0%, var(--bg-color) 100%);
            border-bottom: 2px solid var(--accent-green);
        }

        .collection-cover {
            width: 100%;
            max-width: 380px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            border: 2px solid var(--accent-gold);
            margin-bottom: 1.5rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            color: var(--accent-gold);
            font-size: 2.8rem;
            margin: 0.5rem 0;
            letter-spacing: 2px;
        }

        p.tagline {
            color: var(--text-sub);
            font-size: 1.2rem;
            max-width: 650px;
            margin: 0 auto 1.5rem auto;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .cta-btn {
            display: inline-block;
            background-color: var(--accent-green);
            color: #000;
            padding: 0.8rem 2rem;
            font-weight: bold;
            border-radius: 25px;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
            border: none;
        }

        .cta-btn:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
        }

        .cta-btn.gold {
            background-color: var(--accent-gold);
            color: #000;
        }

        .cta-btn.gold:hover {
            background-color: #d4ac0d;
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .section-title {
            text-align: center;
            color: var(--accent-gold);
            font-size: 2rem;
            margin-bottom: 2rem;
        }

        .action-box {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-green);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 3rem;
            text-align: center;
        }

        .visual-evolution-strip {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            overflow-x: auto;
            padding: 1rem 0 2rem 0;
            margin-bottom: 1.5rem;
        }

        .strip-card {
            text-align: center;
            flex-shrink: 0;
        }

        .strip-card img {
            width: 120px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            border: 1px solid var(--border-color);
        }

        .strip-arrow {
            color: var(--accent-gold);
            font-size: 1.8rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        .evolution-flow {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 3rem;
        }

        .flow-step {
            display: flex;
            align-items: flex-start;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px dashed var(--border-color);
        }

        .flow-step:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .step-num {
            background-color: var(--accent-green);
            color: #000;
            font-weight: bold;
            border-radius: 50%;
            min-width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1.2rem;
            flex-shrink: 0;
        }

        .step-num.mythic {
            background-color: #e74c3c;
            color: #fff;
        }

        .step-content h4 {
            margin: 0 0 0.3rem 0;
            color: var(--accent-gold);
            font-size: 1.2rem;
        }
