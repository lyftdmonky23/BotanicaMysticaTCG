<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botanica Mystica | WAX TCG</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f1412;
            color: #e0e6e3;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
        }

        h1 {
            color: #f1c40f;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        p {
            color: #a0b2a6;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
        }

        .btn {
            background-color: #2ecc71;
            color: #000;
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.2s;
            display: block;
        }

        .btn:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
        }

        .btn.gold {
            background-color: #f1c40f;
            color: #000;
        }

        .btn.gold:hover {
            background-color: #d4ac0d;
        }

        footer {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: #6b7c73;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Botanica Mystica</h1>
        <p>An evolution-driven burn-to-mint NFT trading card game built on the WAX blockchain.</p>
        
        <div class="btn-group">
            <a href="https://wax.atomichub.io/explorer/collection/wax-mainnet/botanicacard" target="_blank" class="btn gold">View Collection on AtomicHub ↗</a>
            <a href="https://wax.mintyblocks.com/mintyblocks/blends" target="_blank" class="btn">Start Blending on MintyBlocks ↗</a>
        </div>

        <footer>
            &copy; 2026 Botanica Mystica &bull; Collection: <code>botanicacard</code>
        </footer>
    </div>

</body>
</html>
