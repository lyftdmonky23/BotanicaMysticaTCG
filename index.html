<!-- Load WaxJS library -->
<script src="https://unpkg.com/@waxio/waxjs@1.3.0/dist-web/waxjs.js"></script>

<script>
    // List of reliable WAX mainnet RPC nodes for automatic failover
    const rpcNodes = [
        'https://wax.greymass.com',
        'https://api.waxsweden.org',
        'https://wax.eosphere.io',
        'https://wax.pink.gg'
    ];

    let currentRpcIndex = 0;
    let wax = new waxjs.WaxJS({
        rpcEndpoint: rpcNodes[currentRpcIndex],
        tryAutoLogin: false
    });

    let currentAccount = null;

    // Helper function to try next RPC node if one fails
    function rotateRpcNode() {
        currentRpcIndex = (currentRpcIndex + 1) % rpcNodes.length;
        console.log("Switching to WAX RPC node:", rpcNodes[currentRpcIndex]);
        wax = new waxjs.WaxJS({
            rpcEndpoint: rpcNodes[currentRpcIndex],
            tryAutoLogin: false
        });
    }

    async function connectWallet() {
        const walletBtn = document.getElementById('wallet-btn');
        const statusText = document.getElementById('wallet-status');

        walletBtn.innerText = "Connecting...";

        try {
            // Initiate My Cloud Wallet login
            currentAccount = await wax.login();
            
            // Success update UI
            walletBtn.innerText = "Wallet Connected";
            walletBtn.style.backgroundColor = "#27ae60";
            statusText.innerHTML = `Connected: <strong style="color: #f1c40f;">${currentAccount}</strong>`;
        } catch (error) {
            console.error("Wallet login error:", error);
            
            // Try rotating node and notify user
            rotateRpcNode();
            
            if (window.location.protocol === 'file:') {
                statusText.innerHTML = `<span style="color:#e74c3c;">⚠️ Please test on GitHub Pages (https://) rather than opening the raw HTML file directly.</span>`;
            } else {
                statusText.innerHTML = `<span style="color:#e74c3c;">Connection error (${error.message || 'Node Timeout'}). Try clicking again.</span>`;
            }
            
            walletBtn.innerText = "Connect WAX Wallet";
        }
    }

    async function executePurchase() {
        const qty = parseInt(document.getElementById('seed-qty').value) || 1;
        const totalAmount = (qty * 0.25).toFixed(8);

        if (!currentAccount) {
            alert("Please connect your WAX Wallet first!");
            await connectWallet();
            if (!currentAccount) return;
        }

        try {
            // Trigger WAX Cloud Wallet transaction pop-up
            const result = await wax.api.transact({
                actions: [{
                    account: 'eosio.token',
                    name: 'transfer',
                    authorization: [{
                        actor: currentAccount,
                        permission: 'active',
                    }],
                    data: {
                        from: currentAccount,
                        to: 'botanicadesg', // Replace with your collection/drop deposit account
                        quantity: `${totalAmount} WAX`,
                        memo: 'Purchase Mythical Seeds',
                    },
                }]
            }, {
                blocksBehind: 3,
                expireSeconds: 30,
            });

            alert(`Success! Purchased ${qty} Mythical Seed(s)!\nTx ID: ${result.transaction_id}`);
        } catch (e) {
            console.error("Transaction failed:", e);
            alert("Transaction canceled or failed: " + e.message);
        }
    }

    // Auto-recalculate WAX total when quantity input changes
    document.getElementById('seed-qty').addEventListener('input', function(e) {
        let val = parseInt(e.target.value);
        if (isNaN(val) || val < 1) val = 1;
        document.getElementById('total-cost').innerText = (val * 0.25).toFixed(2);
    });
</script>
