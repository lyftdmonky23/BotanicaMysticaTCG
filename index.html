<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botanica Mystica | WAX TCG</title>
    <style>
        :root {
            --bg-color: #0f1412;
            --card-bg: #1a231f;
            --accent-green: #2ecc71;
            --accent-gold: #f1c40f;
            --text-main: #e0e6e3;
            --text-sub: #a0b2a6;
            --border-color: #2d3e36;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 3rem 1rem;
            background: linear-gradient(180deg, #141e18 0%, var(--bg-color) 100%);
            border-bottom: 2px solid var(--accent-green);
        }

        h1 {
            color: var(--accent-gold);
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        p.tagline {
            color: var(--text-sub);
            font-size: 1.2rem;
            max-width: 650px;
            margin: 0 auto 1.5rem auto;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .cta-btn {
            display: inline-block;
            background-color: var(--accent-green);
            color: #000;
            padding: 0.8rem 2rem;
            font-weight: bold;
            border-radius: 25px;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
            border: none;
        }

        .cta-btn:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        }

        .cta-btn.gold {
            background-color: var(--accent-gold);
            color: #000;
        }

        .cta-btn.gold:hover {
            background-color: #d4ac0d;
            box-shadow: 0 4px 12px rgba(241, 196, 15, 0.3);
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .section-title {
            text-align: center;
            color: var(--accent-gold);
            font-size: 2rem;
            margin-bottom: 2rem;
        }

        .action-box {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-green);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 3rem;
            text-align: center;
        }

        /* Evolution Cycle Overview Styling */
        .evolution-flow {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 3rem;
        }

        .flow-step {
            display: flex;
            align-items: flex-start;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px dashed var(--border-color);
        }

        .flow-step:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .step-num {
            background-color: var(--accent-green);
            color: #000;
            font-weight: bold;
            border-radius: 50%;
            min-width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1.2rem;
            flex-shrink: 0;
        }

        .step-num.mythic {
            background-color: #e74c3c;
            color: #fff;
        }

        .step-content h4 {
            margin: 0 0 0.3rem 0;
            color: var(--accent-gold);
            font-size: 1.2rem;
        }

        .step-content p {
            margin: 0;
            color: var(--text-sub);
        }

        /* Card Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            justify-content: center;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.2rem;
            text-align: center;
            transition: transform 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            border-color: var(--accent-green);
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            max-width: 230px;
            height: auto;
            border-radius: 8px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .card h3 {
            color: var(--accent-green);
            margin: 0.5rem 0;
        }

        .badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            font-size: 0.85rem;
            border-radius: 12px;
            background-color: #27382f;
            color: var(--accent-gold);
            margin-bottom: 0.8rem;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-sub);
            font-size: 0.9rem;
            border-top: 1px solid #1a231f;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Botanica Mystica</h1>
        <p class="tagline">An evolution-driven burn-to-mint NFT trading card game built on the WAX blockchain.</p>
        
        <div class="btn-group">
            <a href="https://wax.atomichub.io/explorer/collection/wax-mainnet/botanicacard" target="_blank" class="cta-btn gold">View Collection on AtomicHub ↗</a>
            <a href="https://wax.mintyblocks.com/mintyblocks/blends" target="_blank" class="cta-btn">Start Blending on MintyBlocks ↗</a>
        </div>
    </header>

    <div class="container">
        
        <!-- Quick Action Hub -->
        <div class="action-box">
            <h3 style="color: var(--accent-gold); margin-top: 0; font-size: 1.5rem;">Enter the Grove</h3>
            <p style="color: var(--text-sub); max-width: 700px; margin: 0 auto 1.5rem auto;">
                Gather raw seeds on secondary market drops or burn your plant
